<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SilentSiva XP Game Store</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:#fff;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#111827;
position:sticky;
top:0;
}

header h1{
color:#00e5ff;
}

input{
padding:10px;
width:250px;
border:none;
border-radius:8px;
outline:none;
}

.hero{
padding:60px 20px;
text-align:center;
background:linear-gradient(135deg,#00bcd4,#3f51b5);
}

.hero h2{
font-size:40px;
}

.hero p{
margin-top:10px;
font-size:18px;
}

.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#1e293b;
border-radius:15px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card h3{
padding:10px;
}

.price{
padding:0 10px;
color:#00ff99;
font-size:20px;
font-weight:bold;
}

.rating{
padding:10px;
color:gold;
}

button{
margin:10px;
padding:10px;
width:calc(100% - 20px);
border:none;
background:#00bcd4;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#0097a7;
}

footer{
background:#111827;
text-align:center;
padding:20px;
margin-top:30px;
}
</style>
</head>
